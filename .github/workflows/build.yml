name: Build SGI Integra
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install flet pyinstaller

    - name: Compilar
      run: |
        # O comando --collect-all resolve a falta do flet-desktop
        pyinstaller --onefile --noconsole --collect-all flet main.py --name "SGI_Integra"

    - name: Guardar executável
      uses: actions/upload-artifact@v4
      with:
        name: SGI_Integra_Final
        path: dist/SGI_Integra.exe
